name: Keep WorkDo bot awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health check
        run: |
          echo "Pinging $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl -sS -o /dev/null -w 'healthz=%{http_code} time=%{time_total}s\n' \
            --max-time 60 https://workdo-demo-bot.onrender.com/healthz || true
          curl -sS -o /dev/null -w 'app=%{http_code} time=%{time_total}s\n' \
            --max-time 60 https://workdo-demo-bot.onrender.com/app/ || true

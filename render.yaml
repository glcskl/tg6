services:
  - type: web
    name: workdo-demo-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: HOOK_PATH
        value: /webhook
      - key: MINI_APP_URL
        sync: false
